<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTV 00s</title>
<meta name="description" content="MTV 00s — a linear music television channel of 2000s music videos.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="./assets/eurostileunicaseltpro.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/layout.css">
<link rel="stylesheet" href="./css/graphics.css">
<link rel="stylesheet" href="./css/remote.css">
</head>
<body data-power="off">

<div id="tv" class="tv">
  <div id="stage" class="stage" role="region" aria-label="MTV 00s channel">

    <!-- video plane -->
    <div class="plane plane--video" aria-hidden="true">
      <div id="player-wrap" class="player-wrap"><div id="player"></div></div>
    </div>

    <!-- blocks every pointer event from ever reaching the YouTube iframe -->
    <div id="shield" class="shield"></div>

    <!-- analogue noise -->
    <canvas id="static" class="static" aria-hidden="true"></canvas>

    <!-- on-screen graphics -->
    <div class="plane plane--gfx">
      <div id="bug" class="bug" aria-hidden="true">
        <img src="./assets/bug.svg" alt="" class="bug__logo">
      </div>

      <div id="lower" class="lower" data-state="hidden">
        <img id="lower-frame" class="lower__frame" src="./assets/lowerthird-now.svg" alt="">
        <span id="lower-text" class="lower__text"></span>
      </div>

      <p id="announce" class="sr-only" aria-live="polite"></p>
    </div>

    <!-- interstitials -->
    <div id="bumper" class="bumper" hidden aria-hidden="true">
      <div class="bumper__flash"></div>
      <div class="bumper__inner">
        <img src="./assets/logo.svg" alt="" class="bumper__logo">
        <div class="bumper__strap">
          <span class="bumper__kicker" id="bumper-kicker">COMING UP</span>
          <span class="bumper__title" id="bumper-title"></span>
        </div>
      </div>
    </div>

    <div id="paused" class="paused" hidden>
      <div class="paused__inner">
        <div class="paused__bars" aria-hidden="true"><i></i><i></i></div>
        <span>PAUSED</span>
      </div>
    </div>

    <!-- programme guide -->
    <div id="epg" class="epg" hidden role="dialog" aria-modal="true" aria-label="Programme guide">
      <header class="epg__head">
        <img src="./assets/bug.svg" alt="MTV 00s" class="epg__logo">
        <h2 class="epg__title">PROGRAMME GUIDE</h2>
        <button type="button" class="epg__close" data-action="guide" aria-label="Close guide">ESC</button>
      </header>
      <div class="epg__body">
        <section class="epg__col">
          <h3>PREVIOUSLY</h3>
          <ol id="epg-prev" class="epg__list"></ol>
        </section>
        <section class="epg__col epg__col--now">
          <h3>ON AIR</h3>
          <div id="epg-now" class="epg__now"></div>
        </section>
        <section class="epg__col">
          <h3>COMING UP</h3>
          <ol id="epg-next" class="epg__list"></ol>
        </section>
      </div>
    </div>

    <!-- remote -->
    <div id="remote" class="remote" data-visible="false">
      <div class="remote__group">
        <button type="button" class="rbtn" data-action="power" aria-label="Turn off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9" /><path d="M6.5 6.8a8 8 0 1 0 11 0" /></svg></button>
      </div>
      <div class="remote__group remote__group--vol">
        <button type="button" class="rbtn" data-action="mute" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M19 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16 9.5l5 5m0-5l-5 5"/></svg></button>
        <input id="vol" class="vol" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
        <span class="vol__num" id="vol-num">80</span>
      </div>
      <div class="remote__group">
        <button type="button" class="rbtn" data-action="pause" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="p1" x="6" y="5" width="4" height="14" rx="1"/><rect class="p2" x="14" y="5" width="4" height="14" rx="1"/><path class="play" d="M7 5l12 7-12 7z"/></svg></button>
        <button type="button" class="rbtn" data-action="skip" aria-label="Next video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l10 7-10 7z"/><rect x="17" y="5" width="3" height="14" rx="1"/></svg></button>
      </div>
      <div class="remote__group">
        <button type="button" class="rbtn rbtn--wide" data-action="source" id="src-btn"
                title="Video source">SOURCE</button>
        <button type="button" class="rbtn rbtn--wide" data-action="guide">GUIDE</button>
        <button type="button" class="rbtn" data-action="fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
  </div><!-- /stage -->

  <!-- power-on splash -->
  <div id="splash" class="splash">
    <div class="splash__inner">
      <img src="./assets/logo.svg" alt="MTV 00s" class="splash__logo">
      <button type="button" id="power-on" class="splash__btn">TURN ON</button>
      <p class="splash__hint">Sound on. Best watched fullscreen.</p>
    </div>
    <p id="boot-status" class="splash__status" role="status">TUNING…</p>
  </div>

  <div id="offscreen" class="offscreen" hidden aria-hidden="true"></div>
</div>

<script src="./js/main.js" type="module"></script>
</body>
</html>
